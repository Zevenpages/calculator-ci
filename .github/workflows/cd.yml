name: CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Gate: no se deploya si el build o los tests fallan (verde antes de prod)
      - name: Build Docker image
        run: docker build -t calculator-ci .

      - name: Lint (flake8 dentro del container)
        run: docker run --rm calculator-ci flake8 app web tests ci

      - name: Tests (pytest dentro del container)
        run: docker run --rm calculator-ci pytest -q

      - name: Trigger Render deploy
        run: curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Trello - tarjeta "En produccion"
        continue-on-error: true
        run: python3 -m ci.trello create
        env:
          STAGE: en_produccion
          TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          TRELLO_LIST_ID: ${{ secrets.TRELLO_LIST_PROD_ID }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
